<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameBook Organiser - Compte</title>
    <link rel="stylesheet" href="./css/gbo-app-base.css">
    <link rel="stylesheet" href="./css/gbo-account.css">
</head>
<body class="page-account">

    <header class="page-header">
        <img src="../imgs/logo-gbo.svg" class="page-header-logo" alt="logo GameBook Organiser">
        <h1 class="page-title">Mon Compte</h1>
    </header>
    <main class="page-main">
        
        <div class="profile-identity">
            <div class="profile-complet-name"><p class="profile-first-name">Prénom</p> <p class="profile-last-name">NOM</p></div>
            <div class="profile-email"><p class="profile-email-display">monadresseemail@email.com</p></div>
        </div>

        <section class="profile-fields">

            <div class="profile-field">
                <label class="profile-field-label">Prénom</label>
                <div class="profile-field-row">
                    <span class="profile-field-value">Prénom</span>
                    <button class="btn btn-secondary profile-btn-edit" data-field="firstname">
                        Changer
                    </button>
                </div>
            </div>

            <div class="profile-field">
                <label class="profile-field-label">Nom</label>
                <div class="profile-field-row">
                    <span class="profile-field-value">NOM</span>
                    <button class="btn btn-secondary profile-btn-edit" data-field="lastname">
                        Changer
                    </button>
                </div>
            </div>

            <div class="profile-field">
                <label class="profile-field-label">E-mail</label>
                <div class="profile-field-row">
                    <span class="profile-field-value">thiagonerieu@gmail.com</span>
                    <button class="btn btn-secondary profile-btn-edit" data-field="email">
                        Changer
                    </button>
                </div>
            </div>

            <div class="profile-field">
                <label class="profile-field-label">Mot de passe</label>
                <div class="profile-field-row">
                    <span class="profile-field-hint">
                        Modifiez le mot de passe de votre compte.
                    </span>
                    <button class="btn btn-secondary profile-btn-edit" data-field="password">
                        Changer
                    </button>
                </div>
            </div>

        </section>

        <section class="profile-danger">
            <div class="profile-field-row">
                <label class="profile-field-label">Supprimer le compte</label>
                <button class="btn btn-danger" id="btn-delete-account">
                    Supprimer
                </button>
            </div>
        </section>
        
    </main>
    
    <footer class="page-footer">
        
        <nav class="app-bottomnav">
            <a href="./gbo-settings.html" class="bottomnav-item">
                <img src="../shared/icons/icon-settings.svg" class="bottomnav-icon" alt="Paramètres">
            </a>
            <a href="./gbo-language.html" class="bottomnav-item">
                <img src="../shared/icons/icon-langue.svg" class="bottomnav-icon" alt="Langue">
            </a>
            <a href="./gbo-projects.html" class="bottomnav-item">
                <img src="../shared/icons/icon-projects.svg" class="bottomnav-icon" alt="Projets">
            </a>
            <a href="./gbo-profile.html" class="bottomnav-item bottomnav-item--active">
                <img src="../shared/icons/icon-profile.svg" class="bottomnav-icon" alt="Profil">
            </a>
            <a href="./gbo-notifications.html" class="bottomnav-item">
                <img src="../shared/icons/icon-notifications.svg" class="bottomnav-icon" alt="Notifications">
            </a>
        </nav>

    </footer>

    <script src="./js/gbo-account.js"></script>
</body>
</html>
