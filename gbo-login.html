<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="gbo-base.css">
    <link rel="stylesheet" href="gbo-login.css">
</head>
<body class="page-login">

    <header class="page-header">
        <img src="./imgs/logo-gbo.svg" class="page-header-logo" alt="logo GameBook Organiser">
    </header>
    <main class="page-main">
        <form id="form-login" class="form" method="post" action="">

            <div class="form-group">
                <div class="form-label-row">
                    <label class="form-label" for="email">E-mail</label>
                </div>
                <div class="form-input-wrapper">
                    <input id="login-email" class="form-input" type="email" name="email" placeholder="Votre adresse e-mail ici..." required>
                    <span id="icon-email" class="form-icon form-icon-email"></span>
                    <!-- conferir css do icone de email, funcionou antes mas agora bugou. -->
                </div>    
            </div>

            <div class="form-group">
                <div class="form-label-row">
                    <label class="form-label" for="password">Mot de passe</label>
                    <a class="form-link" href="./gbo-account-recovery">Mot de passe oublié ?</a>
                </div>
                <div class="form-input-wrapper">
                    <input id="login-password" class="form-input" type="password" name="password"  placeholder="Votre mot de passe ici..." required>
                    <!-- mover placeholder para a direita ao lado do icone -->
                    <span id="icon-padlock" class="form-icon form-icon-padlock"></span>
                    <span id="icon-password" class="form-icon form-icon-eye"></span>
                </div>
            </div>

            <button class="btn btn-primary" type="submit">Se connecter</button>

        </form>
    </main>
    
    <footer class="page-footer">
        <a href="#" class="page-footer-icon-lang">
            <img src="./icons/icon-langue.svg" class="page-footer-icon" alt="icône des langues">
        </a>
        <p class="page-footer-signup">Pas encore de compte ? 
            <a class="footer-link" href="./gbo-signup">Créer un compte</a>
        </p>
    </footer>
    
    <script src="gbo-script.js"></script>
</body>
</html>
